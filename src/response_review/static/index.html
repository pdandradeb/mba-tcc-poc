<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avaliação humana de respostas · MBA</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header><div><p class="eyebrow">MBA · Avaliação independente</p><h1>Revisão de respostas</h1></div><div class="header-actions"><label>Avaliador<input id="reviewer" placeholder="Seu nome" autocomplete="name"></label><button id="export">Exportar avaliações</button></div></header>
<div id="notice" role="status" aria-live="polite"></div>
<div class="workspace">
<aside><div class="progress"><strong id="progress">Carregando…</strong><progress id="bar" value="0" max="100"></progress><small id="counts"></small></div>
<label>Buscar pergunta<input id="search" type="search" placeholder="Palavra ou código da resposta"></label>
<label>Estado<select id="filter"><option value="all">Todas</option><option value="pending">Pendentes</option><option value="draft">Rascunhos</option><option value="completed">Concluídas</option></select></label>
<label>Tema<select id="category"><option value="all">Todos os temas</option></select></label>
<p id="queue-count" class="muted"></p><nav id="queue" aria-label="Fila de avaliação"></nav>
</aside>
<main id="main"><div class="welcome">Carregando a fila de respostas…</div></main>
</div>
<template id="editor">
<div class="item-heading"><div><p class="eyebrow">Método e parecer automático ocultos</p><h2 id="item-title"></h2><p id="saved" class="muted"></p></div><button id="next" class="secondary">Próxima pendente</button></div>
<details class="guide"><summary>Como avaliar</summary><p>Avalie todo o texto exibido, incluindo as orientações ao consultor. Compare-o com a pergunta, a rubrica e as fontes. Não presuma que uma resposta foi entregue ao consumidor. A fila inclui respostas entregues e minutas retidas, sem indicar seu estado durante o julgamento.</p><ul><li>Marque cada fato esperado como completo, parcial, ausente, não aplicável ou incerto. Copie o trecho literal quando houver cobertura.</li><li>Para afirmações proibidas presentes e problemas adicionais, registre trecho e justificativa. A falta de cobertura não é, por si só, uma afirmação falsa.</li><li>Use “não aplicável” somente quando o fato não for elegível para a pergunta, com justificativa. Use “incerto” quando a evidência não permitir decidir.</li><li>As fontes recuperadas podem ser insuficientes. Consulte também as referências da rubrica e o corpus completo. Distinga falta de apoio documental de contradição.</li><li>Não use o parecer do revisor automático como gabarito. A identidade do método e o estado da execução só aparecem no arquivo exportado.</li></ul><p>A ocultação é parcial: características da redação ou a presença de fontes podem permitir inferir o método. Para avaliadores independentes, use arquivos de avaliações separados.</p></details>
<div class="review-grid"><div class="reading"><section class="card"><h3>Pergunta e contexto</h3><div id="turns"></div><div id="case-evidence"></div></section><section class="card"><h3>Resposta a avaliar</h3><p class="muted">Selecione e copie os trechos que fundamentam sua avaliação.</p><div id="response"></div></section><section class="card"><h3>Fontes para conferência</h3><details open><summary>Referências associadas à rubrica</summary><div id="reference-sources"></div></details><details><summary>Trechos disponíveis na recuperação</summary><div id="retrieved-sources"></div></details><details><summary>Consultar o corpus completo</summary><label>Buscar nas fontes<input id="source-search" type="search" placeholder="Título, termo ou identificador"></label><div id="all-sources"></div></details></section></div>
<form id="judgment" class="judging"><section class="card"><h3>1. Cobertura dos fatos esperados</h3><div id="coverage"></div></section><section class="card"><h3>2. Afirmações proibidas</h3><div id="forbidden"></div></section><section class="card"><h3>3. Outros problemas de conteúdo</h3><p class="muted">Registre erros, contradições ou afirmações sem apoio que não estejam cobertos acima.</p><div id="issues"></div><button id="add-issue" type="button" class="secondary">Adicionar problema</button></section><section class="card"><h3>4. Parecer sobre o conteúdo</h3><label>Resultado<select id="overall" required><option value="">Selecione</option><option value="no_issues">Sem problema identificado</option><option value="issues">Com problema de conteúdo</option><option value="uncertain">Não foi possível concluir</option></select></label><label>Observações<textarea id="notes" rows="4" placeholder="Limitações, dúvida na rubrica ou justificativa de incerteza"></textarea></label></section><div class="savebar"><span id="dirty">Sem alterações</span><button id="save-draft" type="button" class="secondary">Salvar rascunho</button><button id="complete" type="submit">Concluir e avançar</button></div></form></div>
</template>
</body></html>
